services:
  db:
    image: postgres:16
    container_name: peerconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peerconnect
      POSTGRES_PASSWORD: peerconnect_dev
      POSTGRES_DB: peerconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: