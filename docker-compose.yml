services:
  db:
    image: pgvector/pgvector:pg16
    container_name: peerconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: peerconnect
      POSTGRES_PASSWORD: peerconnect_dev
      POSTGRES_DB: peerconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: peerconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: